<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>SPACE POP SHOOTING</title>


<style>

/* =========================================
   基本設定
========================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #080319;

  font-family:
    Arial,
    sans-serif;

  user-select: none;
}


/* =========================================
   ゲームを画面中央に配置
========================================= */

#gameWrapper {

  width: 100vw;
  height: 100vh;

  display: flex;

  justify-content: center;
  align-items: center;

  background: #080319;
}


/* =========================================
   ゲーム画面

   背景画像が16:9なので
   ゲームも16:9
========================================= */

#game {

  position: relative;

  width: min(100vw, 177.78vh);

  aspect-ratio: 16 / 9;

  overflow: hidden;

  background-image:
    url("background.jpeg");

  background-size:
    100% 100%;

  background-position:
    center;

  background-repeat:
    no-repeat;

  cursor: crosshair;

  touch-action: manipulation;
}


/* =========================================
   SCORE / TIME
========================================= */

#hud {

  position: absolute;

  z-index: 1000;

  top: 2%;

  left: 50%;

  transform:
    translateX(-50%);

  width: 52%;

  display: flex;

  justify-content:
    space-between;

  align-items: center;

  pointer-events: none;
}


.hudBox {

  background:
    rgba(15, 5, 55, 0.88);

  border:
    3px solid #ffc93b;

  border-radius:
    14px;

  padding:
    7px 16px;

  color:
    white;

  font-weight:
    900;

  font-size:
    clamp(
      12px,
      2vw,
      27px
    );

  box-shadow:
    0 0 12px #ff9f1c,
    inset 0 0 10px #40149c;
}


#score {

  color:
    #67ff5f;

}


#time {

  color:
    #ffe44d;

}


/* =========================================
   キャラクターの出現位置

   ★ x・y の位置が「キャラの足元」になる
========================================= */

.hole {
  position: absolute;

  left: var(--x);
  top: var(--y);

  width: var(--size);

  /*
    高さを少し大きめにして
    キャラが上に出られるようにする
  */
  height: calc(var(--size) * 2.2);

  /*
    ★ 左右は中央
    ★ 下端をピンク点に合わせる
  */
  transform:
    translate(-50%, -100%);

  pointer-events: none;

  z-index: 20;

  /*
    前みたいな丸い切り抜きはやめる
    → キャラ全身がちゃんと出る
  */
  overflow: visible;
}


/* =========================================
   キャラクター

   普段は完全に非表示
========================================= */

/* キャラクター */
.alien {
  position: absolute;

  width: 140%;
  height: auto;

  left: 50%;
  bottom: 0;

  /* X方向は中央固定、Y方向は待機中なので下に隠す */
  transform:
    translate(-50%, 70%)
    scale(0.85);

  opacity: 0;
  visibility: hidden;

  pointer-events: none;
  cursor: crosshair;

  filter:
    drop-shadow(
      0 5px 5px
      rgba(0, 0, 0, 0.45)
    );
}


/* 出現中 */
.hole.active .alien {
  visibility: visible;
  pointer-events: auto;

  animation:
    alienPop
    0.38s
    cubic-bezier(0.2, 0.9, 0.3, 1.25)
    forwards;
}


/* ひょこっと出る */
@keyframes alienPop {

  0% {
    transform:
      translate(-50%, 70%)
      scale(0.82);

    opacity: 0;
  }

  45% {
    transform:
      translate(-50%, -16%)
      scale(1.07);

    opacity: 1;
  }

  70% {
    transform:
      translate(-50%, -6%)
      scale(0.98);

    opacity: 1;
  }

  100% {
    transform:
      translate(-50%, -8%)
      scale(1);

    opacity: 1;
  }
}


/* 撃たれたとき */
.alien.shot {
  animation:
    alienShot
    0.20s
    forwards;

  pointer-events: none;
}


@keyframes alienShot {

  0% {
    transform:
      translate(-50%, -8%)
      scale(1);

    opacity: 1;
  }

  100% {
    transform:
      translate(-50%, 45%)
      scale(0.35)
      rotate(12deg);

    opacity: 0;
  }
}


/* =========================================
   +500などの得点表示
========================================= */

.pointPopup {

  position:
    absolute;

  z-index:
    3000;

  pointer-events:
    none;


  color:
    #ffff55;

  font-weight:
    900;

  font-size:

    clamp(
      20px,
      4vw,
      48px
    );


  text-shadow:

    3px 3px 0
    #d62d17,

    -2px -2px 0
    #531693;


  transform:

    translate(
      -50%,
      -50%
    );


  animation:

    pointAnimation
    0.8s
    forwards;

}


@keyframes pointAnimation {

  0% {

    transform:

      translate(
        -50%,
        -50%
      )

      scale(0.3);

    opacity:
      0;

  }


  25% {

    transform:

      translate(
        -50%,
        -70%
      )

      scale(1.3);

    opacity:
      1;

  }


  100% {

    transform:

      translate(
        -50%,
        -180%
      )

      scale(1);

    opacity:
      0;

  }

}


/* =========================================
   撃った場所のエフェクト
========================================= */

.shotEffect {

  position:
    absolute;

  z-index:
    4000;

  pointer-events:
    none;


  width:
    20px;

  height:
    20px;


  border-radius:
    50%;


  border:
    5px solid white;


  box-shadow:

    0 0 8px
    white,

    0 0 20px
    #ffe332,

    0 0 35px
    #ff9c22;


  transform:

    translate(
      -50%,
      -50%
    );


  animation:

    shotEffectAnimation
    0.3s
    forwards;

}


@keyframes shotEffectAnimation {

  from {

    width:
      15px;

    height:
      15px;

    opacity:
      1;

  }


  to {

    width:
      70px;

    height:
      70px;

    opacity:
      0;

  }

}


/* =========================================
   START / GAME OVER
========================================= */

#startScreen,
#gameOverScreen {

  position:
    absolute;

  inset:
    0;

  z-index:
    5000;


  display:
    flex;

  flex-direction:
    column;


  justify-content:
    center;

  align-items:
    center;


  text-align:
    center;


  color:
    white;


  background:

    rgba(
      7,
      2,
      35,
      0.82
    );

}


#gameOverScreen {

  display:
    none;

}


/* タイトル */

.gameTitle {

  font-size:

    clamp(
      32px,
      7vw,
      85px
    );


  font-weight:
    900;


  line-height:
    0.95;


  color:
    #ffdc3e;


  text-shadow:

    5px 5px 0
    #6d20a5,

    0 0 20px
    #ff9224;

}


/* 説明 */

.description {

  margin:
    24px;


  font-size:

    clamp(
      15px,
      2.5vw,
      28px
    );


  font-weight:
    bold;

}


/* ボタン */

.gameButton {

  border:

    4px solid
    #ffdc42;


  border-radius:
    18px;


  background:

    linear-gradient(
      #8046ef,
      #41189f
    );


  color:
    white;


  font-weight:
    900;


  font-size:

    clamp(
      16px,
      2.5vw,
      30px
    );


  padding:

    13px
    35px;


  box-shadow:

    0 7px 0
    #281063,

    0 0 18px
    #ffb62d;


  cursor:
    pointer;

}


.gameButton:active {

  transform:
    translateY(5px);


  box-shadow:

    0 2px 0
    #281063;

}


/* 最終スコア */

.finalScore {

  font-size:

    clamp(
      25px,
      5vw,
      55px
    );


  margin:
    20px;


  color:
    #68ff61;


  font-weight:
    900;

}


/* =========================================
   iPad / スマホ
========================================= */

@media
(max-width: 700px) {

  #hud {

    width:
      62%;

  }


  .hudBox {

    padding:

      5px
      9px;

  }

}

</style>

</head>


<body>


<div id="gameWrapper">


<div id="game">


<!-- =====================================
     SCORE / TIME
===================================== -->

<div id="hud">


  <div class="hudBox">

    SCORE

    <span id="score">
      0
    </span>

  </div>


  <div class="hudBox">

    TIME

    <span id="time">
      30
    </span>

  </div>


</div>


<!-- =====================================
     キャラが出る穴
===================================== -->

<div id="holes">
</div>


<!-- =====================================
     START
===================================== -->

<div id="startScreen">


  <div class="gameTitle">

    SPACE
    <br>
    POP SHOOTING

  </div>


  <div class="description">

    穴から出てくるキャラクターを撃て！ 🎯

  </div>


  <button
    id="startButton"
    class="gameButton"
    type="button"
  >

    GAME START

  </button>


</div>


<!-- =====================================
     GAME OVER
===================================== -->

<div id="gameOverScreen">


  <div class="gameTitle">

    TIME UP!

  </div>


  <div class="finalScore">

    SCORE

    <span id="finalScore">

      0

    </span>

  </div>


  <button
    id="restartButton"
    class="gameButton"
    type="button"
  >

    PLAY AGAIN

  </button>


</div>


</div>


</div>



<script>

/* =========================================
   ゲーム時間
========================================= */

const GAME_TIME =
  30;


/* =========================================
   穴の位置と得点

   x = 横位置（%）
   y = 縦位置（%）

   size = キャラが出る範囲

   points = 得点
========================================= */

const holeData = [

  /* ロケット上の丸い窓 */
  {
    x: 47.92,
    y: 34.74,
    size: 8,
    points: 3000
  },

  /* 上段 左 */
  {
    x: 32.80,
    y: 36.71,
    size: 7,
    points: 2000
  },

  /* 上段 右 */
  {
    x: 63.05,
    y: 36.87,
    size: 7,
    points: 2000
  },

  /* 2段目 左 */
  {
    x: 29.37,
    y: 43.73,
    size: 8,
    points: 1000
  },

  /* 2段目 右 */
  {
    x: 67.86,
    y: 43.71,
    size: 8,
    points: 1000
  },

  /* 中段 左端 */
  {
    x: 21.77,
    y: 56.21,
    size: 8,
    points: 500
  },

  /* 中段 右端 */
  {
    x: 77.01,
    y: 55.83,
    size: 8,
    points: 500
  },

  /* ロケットのすぐ下 */
  {
    x: 47.76,
    y: 59.96,
    size: 8,
    points: 2000
  },

  /* 下段 左 */
  {
    x: 28.99,
    y: 68.79,
    size: 8,
    points: 1000
  },

  /* 下段 中央 */
  {
    x: 47.62,
    y: 71.19,
    size: 8,
    points: 2000
  },

  /* 下段 右 */
  {
    x: 68.82,
    y: 68.68,
    size: 8,
    points: 1000
  },

  /* 一番下 左から1 */
  {
    x: 36.30,
    y: 82.41,
    size: 8,
    points: 500
  },

  /* 一番下 左から2 */
  {
    x: 47.19,
    y: 82.30,
    size: 8,
    points: 500
  },

  /* 一番下 左から3 */
  {
    x: 57.41,
    y: 82.28,
    size: 8,
    points: 500
  },

  /* 一番下 右 */
  {
    x: 66.28,
    y: 81.97,
    size: 8,
    points: 500
  }

];


/* =========================================
   ゲームの状態
========================================= */

let score =
  0;


let timeLeft =
  GAME_TIME;


let gameRunning =
  false;


let timerInterval =
  null;


let spawnTimer =
  null;


/* =========================================
   HTMLを取得
========================================= */

const game =

  document.getElementById(
    "game"
  );


const holesContainer =

  document.getElementById(
    "holes"
  );


const scoreText =

  document.getElementById(
    "score"
  );


const timeText =

  document.getElementById(
    "time"
  );


const startScreen =

  document.getElementById(
    "startScreen"
  );


const gameOverScreen =

  document.getElementById(
    "gameOverScreen"
  );


const startButton =

  document.getElementById(
    "startButton"
  );


const restartButton =

  document.getElementById(
    "restartButton"
  );


const finalScore =

  document.getElementById(
    "finalScore"
  );


/* =========================================
   穴を作る
========================================= */

function createHoles() {


  holesContainer.innerHTML =
    "";


  holeData.forEach(

    (data, index) => {


      /*
        穴
      */

      const hole =

        document.createElement(
          "div"
        );


      hole.className =
        "hole";


      hole.style.setProperty(

        "--x",

        data.x + "%"

      );


      hole.style.setProperty(

        "--y",

        data.y + "%"

      );


      hole.style.setProperty(

        "--size",

        data.size + "%"

      );


      hole.dataset.index =
        index;


      /*
        キャラクター画像
      */

      const alien =

        document.createElement(
          "img"
        );


      alien.className =
        "alien";


      /*
        ★ 新しい画像！！
      */

      alien.src =
        "alien-new.png";


      alien.alt =
        "target";


      alien.draggable =
        false;


      /*
        キャラをタップ
      */

      alien.addEventListener(

        "pointerdown",

        function(event) {


          event.preventDefault();


          shootAlien(

            hole,

            alien,

            data,

            event.clientX,

            event.clientY

          );

        }

      );


      hole.appendChild(
        alien
      );


      holesContainer.appendChild(
        hole
      );

    }

  );

}


/* =========================================
   ランダムな穴からキャラ出現
========================================= */

function showRandomAlien() {


  if (!gameRunning) {

    return;

  }


  const holes =

    Array.from(

      document.querySelectorAll(
        ".hole"
      )

    );


  /*
    今キャラが出ていない穴だけ
  */

  const emptyHoles =

    holes.filter(

      hole =>

        !hole.classList.contains(
          "active"
        )

    );


  if (

    emptyHoles.length === 0

  ) {

    return;

  }


  /*
    ランダムに穴を選択
  */

  const randomIndex =

    Math.floor(

      Math.random()

      *

      emptyHoles.length

    );


  const hole =

    emptyHoles[
      randomIndex
    ];


  const alien =

    hole.querySelector(
      ".alien"
    );


  /*
    前回の撃たれた状態を解除
  */

  alien.classList.remove(
    "shot"
  );


  /*
    ★ 穴から出現
  */

  hole.classList.add(
    "active"
  );


  /*
    出ている時間

    0.8秒 ～ 1.8秒
  */

  const stayTime =

    800

    +

    Math.random()

    *

    1000;


  setTimeout(

    () => {


      /*
        まだ撃たれていなければ
        自動で穴に戻る
      */

      if (

        hole.classList.contains(
          "active"
        )

      ) {


        hole.classList.remove(
          "active"
        );


      }

    },

    stayTime

  );

}


/* =========================================
   キャラを撃った
========================================= */

function shootAlien(

  hole,

  alien,

  data,

  clientX,

  clientY

) {


  /*
    ゲーム中じゃなければ無効
  */

  if (!gameRunning) {

    return;

  }


  /*
    穴から出ていないキャラは
    撃てない
  */

  if (

    !hole.classList.contains(
      "active"
    )

  ) {

    return;

  }


  /*
    同じキャラを
    2回撃てないようにする
  */

  if (

    alien.classList.contains(
      "shot"
    )

  ) {

    return;

  }


  /*
    撃たれた状態
  */

  alien.classList.add(
    "shot"
  );


  /*
    得点追加！
  */

  score +=
    data.points;


  scoreText.textContent =
    score;


  /*
    タップ位置を
    ゲーム画面内の座標に変換
  */

  const gameRect =

    game.getBoundingClientRect();


  const x =

    clientX

    -

    gameRect.left;


  const y =

    clientY

    -

    gameRect.top;


  /*
    発射エフェクト
  */

  showShotEffect(
    x,
    y
  );


  /*
    +500などを表示
  */

  showPoints(

    x,

    y,

    data.points

  );


  /*
    撃たれたらすぐ穴へ
  */

  setTimeout(

    () => {


      hole.classList.remove(
        "active"
      );


      alien.classList.remove(
        "shot"
      );


    },

    180

  );

}


/* =========================================
   得点エフェクト
========================================= */

function showPoints(

  x,

  y,

  points

) {


  const popup =

    document.createElement(
      "div"
    );


  popup.className =
    "pointPopup";


  popup.textContent =

    "+"

    +

    points;


  popup.style.left =

    x + "px";


  popup.style.top =

    y + "px";


  game.appendChild(
    popup
  );


  setTimeout(

    () => {

      popup.remove();

    },

    800

  );

}


/* =========================================
   発射エフェクト
========================================= */

function showShotEffect(

  x,

  y

) {


  const effect =

    document.createElement(
      "div"
    );


  effect.className =
    "shotEffect";


  effect.style.left =

    x + "px";


  effect.style.top =

    y + "px";


  game.appendChild(
    effect
  );


  setTimeout(

    () => {

      effect.remove();

    },

    300

  );

}


/* =========================================
   キャラを次々出す
========================================= */

function startSpawning() {


  function nextSpawn() {


    if (!gameRunning) {

      return;

    }


    /*
      まず1体出す
    */

    showRandomAlien();


    /*
      約40%の確率で
      もう1体出す
    */

    if (

      Math.random()
      >
      0.6

    ) {


      setTimeout(

        showRandomAlien,

        180

      );

    }


    /*
      次の出現まで

      0.3 ～ 0.75秒
    */

    const nextTime =

      300

      +

      Math.random()

      *

      450;


    spawnTimer =

      setTimeout(

        nextSpawn,

        nextTime

      );

  }


  nextSpawn();

}


/* =========================================
   ゲーム開始
========================================= */

function startGame() {


  /*
    古いタイマーを停止
  */

  clearInterval(
    timerInterval
  );


  clearTimeout(
    spawnTimer
  );


  /*
    初期化
  */

  score =
    0;


  timeLeft =
    GAME_TIME;


  gameRunning =
    true;


  scoreText.textContent =
    score;


  timeText.textContent =
    timeLeft;


  /*
    画面切り替え
  */

  startScreen.style.display =
    "none";


  gameOverScreen.style.display =
    "none";


  /*
    全キャラを完全に隠す
  */

  document

    .querySelectorAll(
      ".hole"
    )

    .forEach(

      hole => {


        hole.classList.remove(
          "active"
        );


        const alien =

          hole.querySelector(
            ".alien"
          );


        alien.classList.remove(
          "shot"
        );


      }

    );


  /*
    出現開始！
  */

  startSpawning();


  /*
    タイマー
  */

  timerInterval =

    setInterval(

      () => {


        timeLeft--;


        timeText.textContent =
          timeLeft;


        /*
          0秒
        */

        if (

          timeLeft <= 0

        ) {


          endGame();


        }


      },

      1000

    );

}


/* =========================================
   ゲーム終了
========================================= */

function endGame() {


  gameRunning =
    false;


  clearInterval(
    timerInterval
  );


  clearTimeout(
    spawnTimer
  );


  /*
    全キャラを隠す
  */

  document

    .querySelectorAll(
      ".hole"
    )

    .forEach(

      hole => {


        hole.classList.remove(
          "active"
        );


        const alien =

          hole.querySelector(
            ".alien"
          );


        alien.classList.remove(
          "shot"
        );


      }

    );


  /*
    最終得点
  */

  finalScore.textContent =
    score;


  /*
    終了画面
  */

  gameOverScreen.style.display =
    "flex";

}


/* =========================================
   ボタン
========================================= */

startButton.addEventListener(

  "click",

  startGame

);


restartButton.addEventListener(

  "click",

  startGame

);


/* =========================================
   最初に穴を準備
========================================= */

createHoles();

</script>


</body>

</html>
