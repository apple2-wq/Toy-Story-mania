<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>SPACE POP SHOOTING - 2 PLAYER</title>


<style>

/* =========================================
   基本
========================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #080319;

  font-family: Arial, sans-serif;

  user-select: none;
}


/* =========================================
   ゲーム全体
========================================= */

#gameWrapper {

  width: 100vw;
  height: 100vh;

  display: flex;

  justify-content: center;
  align-items: center;

  background: #080319;
}


#game {

  position: relative;

  width: min(100vw, 177.78vh);

  aspect-ratio: 16 / 9;

  overflow: hidden;

  background-image:
    url("background.jpeg");

  background-size:
    100% 100%;

  background-position:
    center;

  background-repeat:
    no-repeat;

  touch-action: manipulation;
}


/* =========================================
   スコア
========================================= */

#hud {

  position: absolute;

  z-index: 1000;

  top: 2%;
  left: 50%;

  transform:
    translateX(-50%);

  width: 70%;

  display: flex;

  justify-content:
    space-between;

  align-items: center;

  pointer-events: none;
}


.hudBox {

  background:
    rgba(15, 5, 55, 0.88);

  border:
    3px solid #ffc93b;

  border-radius:
    14px;

  padding:
    7px 14px;

  color:
    white;

  font-weight:
    900;

  font-size:
    clamp(11px, 1.7vw, 24px);

  box-shadow:
    0 0 12px #ff9f1c,
    inset 0 0 10px #40149c;
}


#score1 {
  color: #55eaff;
}


#score2 {
  color: #ff6bba;
}


#time {
  color: #ffe44d;
}


/* =========================================
   キャラクター出現位置
========================================= */

.hole {

  position: absolute;

  left:
    var(--x);

  top:
    var(--y);

  width:
    var(--size);

  height:
    calc(var(--size) * 2);

  transform:
    translate(-50%, -100%);

  pointer-events: none;

  overflow: visible;

  z-index: 20;
}


/* =========================================
   キャラクター
========================================= */

.alien {

  position: absolute;

  width: 140%;

  height: auto;

  left: 50%;

  bottom: 0;

  transform:
    translate(-50%, 70%)
    scale(0.85);

  opacity: 0;

  visibility: hidden;

  pointer-events: none;

  filter:
    drop-shadow(
      0 5px 5px
      rgba(0,0,0,0.45)
    );
}


/* =========================================
   出現
========================================= */

.hole.active .alien {

  visibility: visible;

  pointer-events: auto;

  animation:
    alienPop
    0.38s
    cubic-bezier(0.2,0.9,0.3,1.25)
    forwards;
}


/* =========================================
   ひょこっ！
========================================= */

@keyframes alienPop {

  0% {

    transform:
      translate(-50%, 70%)
      scale(0.82);

    opacity: 0;
  }


  45% {

    transform:
      translate(-50%, -12%)
      scale(1.07);

    opacity: 1;
  }


  70% {

    transform:
      translate(-50%, -2%)
      scale(0.98);

    opacity: 1;
  }


  100% {

    transform:
      translate(-50%, -4%)
      scale(1);

    opacity: 1;
  }

}


/* =========================================
   撃たれた
========================================= */

.alien.shot {

  animation:
    alienShot
    0.20s
    forwards;

  pointer-events: none;
}


@keyframes alienShot {

  0% {

    transform:
      translate(-50%, -4%)
      scale(1);

    opacity: 1;
  }


  100% {

    transform:
      translate(-50%, 45%)
      scale(0.35)
      rotate(12deg);

    opacity: 0;
  }

}


/* =========================================
   照準
========================================= */

.crosshair {

  position: absolute;

  z-index: 4500;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  font-size:
    clamp(38px, 5vw, 65px);

  font-weight: 900;

  pointer-events: none;

  line-height: 1;
}


/* PLAYER 1 */

#crosshair1 {

  color: #55eaff;

  text-shadow:
    0 0 4px #000,
    0 0 10px #55eaff;
}


/* PLAYER 2 */

#crosshair2 {

  color: #ff6bba;

  text-shadow:
    0 0 4px #000,
    0 0 10px #ff6bba;
}


/* =========================================
   点数表示
========================================= */

.pointPopup {

  position: absolute;

  z-index: 3000;

  pointer-events: none;

  color: #ffff55;

  font-weight: 900;

  font-size:
    clamp(20px, 4vw, 48px);

  text-shadow:
    3px 3px 0 #d62d17,
    -2px -2px 0 #531693;

  transform:
    translate(-50%, -50%);

  animation:
    pointAnimation
    0.8s
    forwards;
}


@keyframes pointAnimation {

  0% {

    transform:
      translate(-50%, -50%)
      scale(0.3);

    opacity: 0;
  }


  25% {

    transform:
      translate(-50%, -70%)
      scale(1.3);

    opacity: 1;
  }


  100% {

    transform:
      translate(-50%, -180%)
      scale(1);

    opacity: 0;
  }

}


/* =========================================
   発射エフェクト
========================================= */

.shotEffect {

  position: absolute;

  z-index: 4000;

  pointer-events: none;

  width: 20px;
  height: 20px;

  border-radius: 50%;

  border: 5px solid white;

  box-shadow:
    0 0 8px white,
    0 0 20px #ffe332,
    0 0 35px #ff9c22;

  transform:
    translate(-50%, -50%);

  animation:
    shotEffectAnimation
    0.3s
    forwards;
}


@keyframes shotEffectAnimation {

  from {

    width: 15px;
    height: 15px;

    opacity: 1;
  }


  to {

    width: 70px;
    height: 70px;

    opacity: 0;
  }

}


/* =========================================
   START / GAME OVER
========================================= */

#startScreen,
#gameOverScreen {

  position: absolute;

  inset: 0;

  z-index: 5000;

  display: flex;

  flex-direction: column;

  justify-content: center;

  align-items: center;

  text-align: center;

  color: white;

  background:
    rgba(7,2,35,0.82);
}


#gameOverScreen {

  display: none;
}


.gameTitle {

  font-size:
    clamp(32px,7vw,85px);

  font-weight: 900;

  line-height: 0.95;

  color: #ffdc3e;

  text-shadow:
    5px 5px 0 #6d20a5,
    0 0 20px #ff9224;
}


.description {

  margin: 24px;

  font-size:
    clamp(15px,2.5vw,28px);

  font-weight: bold;
}


.gameButton {

  border:
    4px solid #ffdc42;

  border-radius: 18px;

  background:
    linear-gradient(
      #8046ef,
      #41189f
    );

  color: white;

  font-weight: 900;

  font-size:
    clamp(16px,2.5vw,30px);

  padding:
    13px 35px;

  box-shadow:
    0 7px 0 #281063,
    0 0 18px #ffb62d;

  cursor: pointer;
}


.gameButton:active {

  transform:
    translateY(5px);
}


.finalScore {

  font-size:
    clamp(20px,4vw,50px);

  margin: 10px;

  font-weight: 900;
}


.p1Final {

  color: #55eaff;
}


.p2Final {

  color: #ff6bba;
}


/* =========================================
   iPadなど
========================================= */

@media
(max-width: 700px) {

  #hud {

    width: 78%;
  }


  .hudBox {

    padding:
      4px 7px;
  }

}

#controllerDebug {
  position: absolute;
  left: 10px;
  bottom: 10px;

  z-index: 9999;

  background: rgba(0,0,0,0.7);
  color: white;

  padding: 8px;

  font-size: 12px;
}

</style>

</head>


<body>

<script>

/* =========================================
   基本設定
========================================= */

const GAME_TIME = 30;


/*
  Joy-Conの設定

  反応しない場合は
  BUTTONの数字を変えて試す。

  0 / 1 / 2 / 3 あたり。
*/

const PLAYER1_BUTTON = 0;

const PLAYER2_BUTTON = 0;


/*
  スティックの軸

  通常は
  0 = 横
  1 = 縦
*/

const PLAYER1_AXIS_X = 0;
const PLAYER1_AXIS_Y = 1;

const PLAYER2_AXIS_X = 0;
const PLAYER2_AXIS_Y = 1;


/*
  照準速度
*/

const AIM_SPEED = 0.75;


/*
  スティックの
  微妙なブレを無視
*/

const DEAD_ZONE = 0.15;


/* =========================================
   穴の位置

   前に合わせた位置そのまま
========================================= */

const holeData = [


  /* ロケット上 */

  {
    x: 47.92,
    y: 38.5,
    size: 8,
    points: 3000
  },


  /* 上段 左 */

  {
    x: 32.80,
    y: 36.71,
    size: 7,
    points: 2000
  },


  /* 上段 右 */

  {
    x: 63.05,
    y: 36.87,

    points: 2000
  },


  /* 2段目 左 */

  {
    x: 29.37,
    y: 43.73,
    size: 8,
    points: 1000
  },


  /* 2段目 右 */

  {
    x: 67.86,
    y: 43.71,
    size: 8,
    points: 1000
  },


  /* 中段 左 */

  {
    x: 21.77,
    y: 56.21,
    size: 8,
    points: 500
  },


  /* 中段 右 */

  {
    x: 77.01,
    y: 55.83,
    size: 8,
    points: 500
  },


  /* ロケット下 */

  {
    x: 47.76,
    y: 59.96,
    size: 8,
    points: 2000
  },


  /* 下段 左 */

  {
    x: 28.99,
    y: 68.79,
    size: 8,
    points: 1000
  },


  /* 下段 中央 */

  {
    x: 47.62,
    y: 71.19,
    size: 8,
    points: 2000
  },


  /* 下段 右 */

  {
    x: 68.82,
    y: 68.68,
    size: 8,
    points: 1000
  },


  /* 一番下 */

  {
    x: 36.30,
    y: 82.41,
    size: 8,
    points: 500
  },


  {
    x: 47.19,
    y: 82.30,
    size: 8,
    points: 500
  },


  {
    x: 57.41,
    y: 82.28,
    size: 8,
    points: 500
  },


  {
    x: 66.28,
    y: 81.97,
    size: 8,
    points: 500
  }

];


/* =========================================
   スコア
========================================= */

let score1 = 0;

let score2 = 0;

let timeLeft =
  GAME_TIME;

let gameRunning =
  false;

let timerInterval =
  null;

let spawnTimer =
  null;


/* =========================================
   照準位置
========================================= */

let aim1X = 42;
let aim1Y = 55;

let aim2X = 58;
let aim2Y = 55;


/* =========================================
   ボタン状態

   押しっぱなしで
   連射されないようにする
========================================= */

let previousButton1 =
  false;

let previousButton2 =
  false;


/* =========================================
   HTML
========================================= */

const game =
  document.getElementById(
    "game"
  );


const holesContainer =
  document.getElementById(
    "holes"
  );


const scoreText1 =
  document.getElementById(
    "score1"
  );


const scoreText2 =
  document.getElementById(
    "score2"
  );


const timeText =
  document.getElementById(
    "time"
  );


const startScreen =
  document.getElementById(
    "startScreen"
  );


const gameOverScreen =
  document.getElementById(
    "gameOverScreen"
  );


const startButton =
  document.getElementById(
    "startButton"
  );


const restartButton =
  document.getElementById(
    "restartButton"
  );


const finalScore1 =
  document.getElementById(
    "finalScore1"
  );


const finalScore2 =
  document.getElementById(
    "finalScore2"
  );


const crosshair1 =
  document.getElementById(
    "crosshair1"
  );


const crosshair2 =
  document.getElementById(
    "crosshair2"
  );


/* =========================================
   効果音
========================================= */

let audioContext =
  null;


function getAudioContext() {

  if (!audioContext) {

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  return audioContext;
}


function playTone(
  frequency,
  duration,
  volume = 0.10
) {

  const context =
    getAudioContext();


  const oscillator =
    context.createOscillator();


  const gain =
    context.createGain();


  oscillator.connect(
    gain
  );


  gain.connect(
    context.destination
  );


  oscillator.type =
    "sine";


  oscillator.frequency.value =
    frequency;


  gain.gain.setValueAtTime(
    volume,
    context.currentTime
  );


  gain.gain.exponentialRampToValueAtTime(
    0.001,
    context.currentTime + duration
  );


  oscillator.start();


  oscillator.stop(
    context.currentTime + duration
  );

}


/* 点数によって音変更 */

function playHitSound(
  points
) {

  if (
    points === 500
  ) {

    playTone(
      440,
      0.12
    );

  }


  else if (
    points === 1000
  ) {

    playTone(
      620,
      0.15
    );

  }


  else if (
    points === 2000
  ) {

    playTone(
      780,
      0.12
    );


    setTimeout(
      () => {

        playTone(
          980,
          0.15
        );

      },
      90
    );

  }


  else {

    playTone(
      700,
      0.10
    );


    setTimeout(
      () => {

        playTone(
          950,
          0.10
        );

      },
      80
    );


    setTimeout(
      () => {

        playTone(
          1250,
          0.18
        );

      },
      160
    );

  }

}


/* =========================================
   穴を作る
========================================= */

function createHoles() {


  holesContainer.innerHTML =
    "";


  holeData.forEach(

    (data,index) => {


      const hole =
        document.createElement(
          "div"
        );


      hole.className =
        "hole";


      hole.style.setProperty(
        "--x",
        data.x + "%"
      );


      hole.style.setProperty(
        "--y",
        data.y + "%"
      );


      hole.style.setProperty(
        "--size",
        data.size + "%"
      );


      hole.dataset.index =
        index;


      const alien =
        document.createElement(
          "img"
        );


      alien.className =
        "alien";


      alien.src =
        "alien-new.png";


      alien.alt =
        "target";


      alien.draggable =
        false;


      hole.appendChild(
        alien
      );


      holesContainer.appendChild(
        hole
      );

    }

  );

}


/* =========================================
   キャラ出現
========================================= */

function showRandomAlien() {


  if (!gameRunning) {

    return;

  }


  const holes =
    Array.from(

      document.querySelectorAll(
        ".hole"
      )

    );


  const emptyHoles =
    holes.filter(

      hole =>

        !hole.classList.contains(
          "active"
        )

    );


  if (
    emptyHoles.length === 0
  ) {

    return;

  }


  const hole =

    emptyHoles[

      Math.floor(

        Math.random()

        *

        emptyHoles.length

      )

    ];


  const alien =
    hole.querySelector(
      ".alien"
    );


  alien.classList.remove(
    "shot"
  );


  hole.classList.add(
    "active"
  );


  /*
    出ている時間
  */

  const stayTime =

    800

    +

    Math.random()

    *

    1000;


  setTimeout(

    () => {


      if (

        hole.classList.contains(
          "active"
        )

      ) {


        hole.classList.remove(
          "active"
        );


      }

    },

    stayTime

  );

}


/* =========================================
   キャラ出現ループ
========================================= */

function startSpawning() {


  function nextSpawn() {


    if (!gameRunning) {

      return;

    }


    showRandomAlien();


    /*
      ときどき2体同時
    */

    if (
      Math.random() > 0.6
    ) {


      setTimeout(
        showRandomAlien,
        180
      );

    }


    const nextTime =

      300

      +

      Math.random()

      *

      450;


    spawnTimer =

      setTimeout(
        nextSpawn,
        nextTime
      );

  }


  nextSpawn();

}


/* =========================================
   発射
========================================= */

function shootWithCrosshair(
  player
) {


  if (!gameRunning) {

    return;

  }


  let crosshair;


  if (
    player === 1
  ) {

    crosshair =
      crosshair1;

  }

  else {

    crosshair =
      crosshair2;

  }


  const crosshairRect =
    crosshair.getBoundingClientRect();


  const aimCenterX =

    crosshairRect.left

    +

    crosshairRect.width / 2;


  const aimCenterY =

    crosshairRect.top

    +

    crosshairRect.height / 2;


  const activeAliens =

    document.querySelectorAll(
      ".hole.active .alien"
    );


  let hit =
    false;


  for (
    const alien of activeAliens
  ) {


    /*
      すでに撃たれたキャラは無視
    */

    if (
      alien.classList.contains(
        "shot"
      )
    ) {

      continue;

    }


    const rect =
      alien.getBoundingClientRect();


    /*
      照準の中心が
      キャラ画像の範囲内か
    */

    if (

      aimCenterX >= rect.left

      &&

      aimCenterX <= rect.right

      &&

      aimCenterY >= rect.top

      &&

      aimCenterY <= rect.bottom

    ) {


      const hole =
        alien.closest(
          ".hole"
        );


      const index =
        Number(
          hole.dataset.index
        );


      const data =
        holeData[index];


      hitAlien(

        player,

        hole,

        alien,

        data,

        aimCenterX,

        aimCenterY

      );


      hit =
        true;


      break;

    }

  }


  /*
    外れても
    発射エフェクト
  */

  if (!hit) {


    const gameRect =
      game.getBoundingClientRect();


    showShotEffect(

      aimCenterX
      -
      gameRect.left,

      aimCenterY
      -
      gameRect.top

    );

  }

}


/* =========================================
   命中
========================================= */

function hitAlien(

  player,

  hole,

  alien,

  data,

  clientX,

  clientY

) {


  if (

    !gameRunning

    ||

    !hole.classList.contains(
      "active"
    )

    ||

    alien.classList.contains(
      "shot"
    )

  ) {

    return;

  }


  /*
    ★ まず撃たれた状態にする

    これで2人が同時に撃っても
    基本的に先に当てた方だけ得点
  */

  alien.classList.add(
    "shot"
  );


  hole.classList.remove(
    "active"
  );


  /*
    プレイヤー別得点
  */

  if (
    player === 1
  ) {


    score1 +=
      data.points;


    scoreText1.textContent =
      score1;

  }


  else {


    score2 +=
      data.points;


    scoreText2.textContent =
      score2;

  }


  /*
    音
  */

  playHitSound(
    data.points
  );


  const gameRect =
    game.getBoundingClientRect();


  const x =

    clientX

    -

    gameRect.left;


  const y =

    clientY

    -

    gameRect.top;


  /*
    エフェクト
  */

  showShotEffect(
    x,
    y
  );


  showPoints(

    x,

    y,

    data.points,

    player

  );


  /*
    元に戻す
  */

  setTimeout(

    () => {


      alien.classList.remove(
        "shot"
      );


    },

    250

  );

}


/* =========================================
   得点表示
========================================= */

function showPoints(

  x,

  y,

  points,

  player

) {


  const popup =
    document.createElement(
      "div"
    );


  popup.className =
    "pointPopup";


  popup.textContent =

    "P"

    +

    player

    +

    " +"

    +

    points;


  if (
    player === 1
  ) {

    popup.style.color =
      "#55eaff";

  }

  else {

    popup.style.color =
      "#ff6bba";

  }


  popup.style.left =
    x + "px";


  popup.style.top =
    y + "px";


  game.appendChild(
    popup
  );


  setTimeout(

    () => {

      popup.remove();

    },

    800

  );

}


/* =========================================
   発射エフェクト
========================================= */

function showShotEffect(
  x,
  y
) {


  const effect =
    document.createElement(
      "div"
    );


  effect.className =
    "shotEffect";


  effect.style.left =
    x + "px";


  effect.style.top =
    y + "px";


  game.appendChild(
    effect
  );


  setTimeout(

    () => {

      effect.remove();

    },

    300

  );

}


/* =========================================
   Joy-Con

   1台目 = PLAYER 1
   2台目 = PLAYER 2
========================================= */

function updateControllers() {


  const gamepads =
    navigator.getGamepads();


  /*
    接続中のコントローラーだけ取得
  */

  const pads =

    Array.from(
      gamepads
    )

    .filter(
      pad => pad !== null
    );


  const pad1 =
    pads[0];


  const pad2 =
    pads[1];


  /* =====================================
     PLAYER 1
  ===================================== */

  if (
    pad1
  ) {


    const x =

      pad1.axes[
        PLAYER1_AXIS_X
      ] || 0;


    const y =

      pad1.axes[
        PLAYER1_AXIS_Y
      ] || 0;


    if (
      Math.abs(x)
      >
      DEAD_ZONE
    ) {

      aim1X +=
        x * AIM_SPEED;

    }


    if (
      Math.abs(y)
      >
      DEAD_ZONE
    ) {

      aim1Y +=
        y * AIM_SPEED;

    }


    aim1X =
      Math.max(
        2,
        Math.min(
          98,
          aim1X
        )
      );


    aim1Y =
      Math.max(
        3,
        Math.min(
          97,
          aim1Y
        )
      );


    crosshair1.style.left =
      aim1X + "%";


    crosshair1.style.top =
      aim1Y + "%";


    const pressed =

      pad1.buttons[
        PLAYER1_BUTTON
      ]?.pressed || false;


    if (

      pressed

      &&

      !previousButton1

    ) {

      shootWithCrosshair(
        1
      );

    }


    previousButton1 =
      pressed;

  }


  /* =====================================
     PLAYER 2
  ===================================== */

  if (
    pad2
  ) {


    const x =

      pad2.axes[
        PLAYER2_AXIS_X
      ] || 0;


    const y =

      pad2.axes[
        PLAYER2_AXIS_Y
      ] || 0;


    if (
      Math.abs(x)
      >
      DEAD_ZONE
    ) {

      aim2X +=
        x * AIM_SPEED;

    }


    if (
      Math.abs(y)
      >
      DEAD_ZONE
    ) {

      aim2Y +=
        y * AIM_SPEED;

    }


    aim2X =
      Math.max(
        2,
        Math.min(
          98,
          aim2X
        )
      );


    aim2Y =
      Math.max(
        3,
        Math.min(
          97,
          aim2Y
        )
      );


    crosshair2.style.left =
      aim2X + "%";


    crosshair2.style.top =
      aim2Y + "%";


    const pressed =

      pad2.buttons[
        PLAYER2_BUTTON
      ]?.pressed || false;


    if (

      pressed

      &&

      !previousButton2

    ) {

      shootWithCrosshair(
        2
      );

    }


    previousButton2 =
      pressed;

  }


  requestAnimationFrame(
    updateControllers
  );

}


/* =========================================
   ゲーム開始
========================================= */

function startGame() {


  clearInterval(
    timerInterval
  );


  clearTimeout(
    spawnTimer
  );


  score1 = 0;

  score2 = 0;


  timeLeft =
    GAME_TIME;


  gameRunning =
    true;


  scoreText1.textContent =
    score1;


  scoreText2.textContent =
    score2;


  timeText.textContent =
    timeLeft;


  /*
    照準初期位置
  */

  aim1X = 42;
  aim1Y = 55;

  aim2X = 58;
  aim2Y = 55;


  crosshair1.style.left =
    aim1X + "%";


  crosshair1.style.top =
    aim1Y + "%";


  crosshair2.style.left =
    aim2X + "%";


  crosshair2.style.top =
    aim2Y + "%";


  startScreen.style.display =
    "none";


  gameOverScreen.style.display =
    "none";


  document

    .querySelectorAll(
      ".hole"
    )

    .forEach(

      hole => {


        hole.classList.remove(
          "active"
        );


        const alien =
          hole.querySelector(
            ".alien"
          );


        alien.classList.remove(
          "shot"
        );

      }

    );


  startSpawning();


  timerInterval =

    setInterval(

      () => {


        timeLeft--;


        timeText.textContent =
          timeLeft;


        if (
          timeLeft <= 0
        ) {

          endGame();

        }


      },

      1000

    );

}


/* =========================================
   終了
========================================= */

function endGame() {


  gameRunning =
    false;


  clearInterval(
    timerInterval
  );


  clearTimeout(
    spawnTimer
  );


  document

    .querySelectorAll(
      ".hole"
    )

    .forEach(

      hole => {


        hole.classList.remove(
          "active"
        );


        const alien =
          hole.querySelector(
            ".alien"
          );


        alien.classList.remove(
          "shot"
        );

      }

    );


  finalScore1.textContent =
    score1;


  finalScore2.textContent =
    score2;


  gameOverScreen.style.display =
    "flex";

}


/* =========================================
   STARTボタン
========================================= */

startButton.addEventListener(

  "click",

  startGame

);


restartButton.addEventListener(

  "click",

  startGame

);


/* =========================================
   初期化
========================================= */

createHoles();

updateControllers();

  const pads =

setInterval(() => {

</script>
